<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仙草共鳴計算器</title>

<style>
body{font-family:Arial;background:#f2f2f2;margin:0;font-size:14px;}
.page{padding:10px;}
.card{background:white;padding:10px;margin-bottom:10px;border-radius:8px;}
.row{display:flex;gap:6px;margin-bottom:6px;}
input,select{width:100%;padding:6px;font-size:14px;}
button{width:100%;padding:10px;border:none;border-radius:8px;font-size:15px;}
.btnStart{background:#4CAF50;color:white;}
.btnLoading{background:#ff9aa2;color:white;}
.btnBack{background:#888;color:white;}
table{width:100%;border-collapse:collapse;}
td,th{border:1px solid #ccc;padding:6px;text-align:center;}
.hidden{display:none;}
.selectWrap{
  display:flex;
  align-items:center;
  gap:6px;
  width:100%;
}
.selNo{
  min-width:22px;
  height:22px;
  border-radius:6px;
  background:#eee;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
}
.selectWrap select{
  width:100%;
}
.inputWrap{
  width:100%;
  display:flex;
  flex-direction:column;
  gap:3px;
}
.inlineField{
  display:flex;
  align-items:center;
  gap:6px;
  width:100%;
}

.inlineField label{
  min-width:36px;  /* 控制對齊 */
  font-size:13px;
  color:#0c0a0a;
}

.inlineField input{
  flex:1;
}
.hint {
  color: #888;
  font-size: 12px;
}
.sectionTitle{
  font-size:14px;
  font-weight:600;
  margin-bottom:6px;
}
.rowLack{
  background:#ffe9e9;   /* 淡紅底 */
}

.rowLack td{
  color:#b00020;        /* 深紅字 */
  font-weight:600;
}
.row_sup { background:#e8f7ec; }   /* 淡綠 */
.row_ctl { background:#eaf4ff; }   /* 淡藍 */
.row_agi { background:#f3eaff; }   /* 淡紫 */
.row_str { background:#fff2e6; }   /* 淡橘 */

@media (max-width: 600px){

  body{
    font-size:16px;
  }

  input,select{
    font-size:16px;
    padding:10px;
  }

  button{
    font-size:18px;
    padding:12px;
  }

  .card{
    padding:12px;
    margin-bottom:12px;
  }

  h3{
    font-size:20px;
  }

}
.layout{
  display: block;
}

/* 桌機：左右兩欄 */
@media (min-width: 1024px){
  .layout{
    display: grid;
    grid-template-columns: 520px 1fr; /* 左固定、右自適應 */
    gap: 12px;
    padding: 10px;
  }

  #pageInput{
    padding: 0;
  }

  #pageResult{
    padding: 0;
  }

  .resultPane{
    position: sticky;
    top: 10px;
    height: calc(100vh - 20px);
    overflow: auto;
  }
}
/* 桌機：強制顯示結果區（即使有 hidden） */
@media (min-width: 1024px){
  #pageResult.hidden{
    display: block !important;
  }
}
/* 桌機：隱藏「返回」按鈕 */
@media (min-width: 1024px){
  #pageResult .btnBack{
    display: none !important;
  }
}
</style>
</head>

<body>
<div class="layout">
<div id="pageInput" class="page">

<h3>仙草共鳴計算器</h3>

<div class="card">
<div class="sectionTitle">階段</div>
<select id="stage">
<option value="1">4階</option>
<option value="2">6階</option>
<option value="3">8階</option>
<option value="4">10階（目前只有第一頁10階的算法）</option>
</select>
</div>

<div class="card">
<div class="sectionTitle">通用（相思 / 幽香）</div>
<div class="row">
<input id="ownX" placeholder="相思" inputmode="numeric">
<input id="ownY" placeholder="幽香" inputmode="numeric">
</div>
</div>

<div class="card">
<div class="sectionTitle">強攻（大草 / 小草）</div>
<div class="row">
<input id="ownC_str" placeholder="大草" inputmode="numeric">
<input id="ownD_str" placeholder="小草" inputmode="numeric">
</div>

<div class="sectionTitle">敏攻（大草 / 小草）</div>
<div class="row">
<input id="ownC_agi" placeholder="大草" inputmode="numeric">
<input id="ownD_agi" placeholder="小草" inputmode="numeric">
</div>

<div class="sectionTitle">控制（大草 / 小草）</div>
<div class="row">
<input id="ownC_ctl" placeholder="大草" inputmode="numeric">
<input id="ownD_ctl" placeholder="小草" inputmode="numeric">
</div>


<div class="sectionTitle">輔助（大草 / 小草）</div>
<div class="row">
<input id="ownC_sup" placeholder="大草" inputmode="numeric">
<input id="ownD_sup" placeholder="小草" inputmode="numeric">
</div>
</div>


<div class="card">
<div class="sectionTitle">各類型要做幾個</div>
<div class="row">

  <div class="inlineField">
    <label>強攻</label>
    <input id="cnt_str" inputmode="numeric">
  </div>

  <div class="inlineField">
    <label>敏攻</label>
    <input id="cnt_agi" inputmode="numeric">
  </div>

</div>

<div class="row">

  <div class="inlineField">
    <label>控制</label>
    <input id="cnt_ctl" inputmode="numeric">
  </div>

  <div class="inlineField">
    <label>輔助</label>
    <input id="cnt_sup" inputmode="numeric">
  </div>

</div>
</div>


<div class="card">
  <div class="sectionTitle">缺額策略（1最優先缺，4最後）</div>
  <div class="hint">
  當計算結果缺額不符合預期時可選<br>
</div>
  <div class="row">
    <div class="selectWrap">
      <span class="selNo">1</span>
      <select id="lack1">
        <option value="none">不允許缺</option>
        <option value="x">相思</option>
        <option value="y">幽香</option>
        <option value="c">大草</option>
        <option value="d">小草</option>
      </select>
    </div>

    <div class="selectWrap">
      <span class="selNo">2</span>
      <select id="lack2">
        <option value="none">不允許缺</option>
        <option value="x">相思</option>
        <option value="y">幽香</option>
        <option value="c">大草</option>
        <option value="d">小草</option>
      </select>
    </div>
  </div>

  <div class="row">
    <div class="selectWrap">
      <span class="selNo">3</span>
      <select id="lack3">
        <option value="none">不允許缺</option>
        <option value="x">相思</option>
        <option value="y">幽香</option>
        <option value="c">大草</option>
        <option value="d">小草</option>
      </select>
    </div>

    <div class="selectWrap">
      <span class="selNo">4</span>
      <select id="lack4">
        <option value="none">不允許缺</option>
        <option value="x">相思</option>
        <option value="y">幽香</option>
        <option value="c">大草</option>
        <option value="d">小草</option>
      </select>
    </div>
  </div>
</div>


<div class="card">
<button id="btnCalc" type="button" class="btnStart">開始計算</button>
</div>

</div>


<div id="pageResult" class="page hidden resultPane">

<h3>計算結果</h3>

<div class="card">
<table id="resultTable">
<tr>
<th>序</th><th>類型</th><th>相思</th><th>幽香</th><th>大草</th><th>小草</th>
</tr>
</table>
</div>

<div class="card">
<table id="diffTable">
<tr>
<th>項目</th><th>花費</th><th>擁有</th><th>差額</th><th>狀態</th>
</tr>
</table>
</div>

<button class="btnBack" onclick="back()">返回</button>

</div>
</div>

<script type="module" src="/src/main.js"></script>

</body>
</html>
